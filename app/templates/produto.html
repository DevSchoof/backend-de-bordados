<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
</head>
<body>
    <h1>Cadastro de Produtoss</h1>
    <form method="POST" action="{{url_for('main.produto')}}" >
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <br>
        <label for ="descricao">Descrição:</label>
        <input type="text" id="descricao" name="descricao" required>
        <br>
        <label for ="alt">Alt:</label>
        <input type="text" id="alt" name="alt" required>
        <br>
        <label for ="url_imagem">URL da Imagem:</label>
        <input type="text" id="url_imagem" name="url_imagem" required>
        <br>
        <button type="submit">Cadastrar</button>
    </form>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul>
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
   
    {% else %}
        <p>Nenhuma mensagem para exibir.</p>
      
    {% endif %}
    {% endwith %}


    <a href="{{ url_for('main.index') }}">ec
        <button>Voltar</button>
    </a>
</body>
</html>
